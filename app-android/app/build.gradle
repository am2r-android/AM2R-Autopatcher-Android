plugins {
    id 'com.android.application'
}

android {
    namespace 'com.community.am2r.patcher'
    compileSdk 36
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.community.am2r.patcher"
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "1.5.5.10"
        manifestPlaceholders = [appLabel: 'AM2R Patcher']
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        ndkBuild { path 'src/main/jni/Android.mk' }
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("AM2R_KS") ?: "/dev/null")
            storePassword System.getenv("AM2R_KS_PASS") ?: ""
            keyAlias System.getenv("AM2R_KS_ALIAS") ?: ""
            keyPassword System.getenv("AM2R_KS_KEYPASS") ?: ""
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.test'
            manifestPlaceholders = [appLabel: 'AM2R Patcher Test']
            ndk { abiFilters 'arm64-v8a', 'x86_64' }
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // The splice reads wrapper.bin as a plain stream; keep the big patch
    // assets uncompressed in the APK so reads are direct.
    androidResources {
        noCompress 'bin', 'xdelta'
    }

    sourceSets {
        main {
            assets.srcDirs += [new File(projectDir, '../../patch-bundle').absolutePath]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('verifyPatchBundle') {
    doLast {
        ['standard', 'dual'].each { edition ->
            def folder = new File(projectDir, "../../patch-bundle/${edition}")
            def manifest = new File(folder, 'assembly.json')
            if (!manifest.isFile()) throw new GradleException("Missing ${edition} patch data")
            def data = new groovy.json.JsonSlurper().parse(manifest)
            ['wrapper.bin', data.droid.xdelta].each { name ->
                if (!new File(folder, name).isFile()) throw new GradleException("Incomplete ${edition} patch data")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyPatchBundle' }
